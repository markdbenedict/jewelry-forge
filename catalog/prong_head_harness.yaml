# Harness for the prong_head library block (ntop/blocks/prong_head.ntop, which embeds stone_seat).
# Built by ntop/recipes/prong_head.py; run by `python -m ntopjewel head ...`; every number from
# ntopjewel.heads.HeadSpec.notebook_inputs.
notebook: prong_head_harness.ntop
version: 0.3.0
title: Prong head (N prongs, open basket, seat cut by stone_seat)
output:
  name: Volume
  type: scalar
  units: mm^3
  doc: Volume Integral of 1 over the head; the gate checks it against the independent
    head mesh.
inputs:
  Seat Path:
    type: text
    doc: Seat envelope STL (gems.seat_envelope) for the stone_seat block inside.
  Clearance:
    type: scalar
    units: mm
    min: 0.0
    max: 0.5
    doc: Stone-to-seat gap.
  Prong Count:
    type: integer
    min: 3
    max: 8
    doc: Prongs round the stone.
  Prong Spacing:
    type: scalar
    units: deg
    min: 45.0
    max: 120.0
    doc: 360 / Prong Count.
  Prong Radius:
    type: scalar
    units: mm
    min: 0.3
    max: 1.5
    doc: Half the prong diameter.
  Base X:
    type: scalar
    units: mm
    min: -10
    max: 10
    doc: First prong's foot (axis end) below the culet.
  Base Y:
    type: scalar
    units: mm
    min: -10
    max: 10
  Base Z:
    type: scalar
    units: mm
    min: -15
    max: 0
  Tip X:
    type: scalar
    units: mm
    min: -15
    max: 15
    doc: First prong's tip centre above the girdle.
  Tip Y:
    type: scalar
    units: mm
    min: -15
    max: 15
  Tip Z:
    type: scalar
    units: mm
    min: 0
    max: 10
  Upper Rail Z:
    type: scalar
    units: mm
    min: -15
    max: 0
    doc: Upper basket rail, below the girdle.
  Upper Rail Radius:
    type: scalar
    units: mm
    min: 0.5
    max: 15
    doc: Through the prong axes at that height.
  Lower Rail Z:
    type: scalar
    units: mm
    min: -15
    max: 0
    doc: Lower rail, through the prong feet.
  Lower Rail Radius:
    type: scalar
    units: mm
    min: 0.3
    max: 15
  Rail Tube Radius:
    type: scalar
    units: mm
    min: 0.25
    max: 1.0
    doc: Half the rail diameter.
  Mesh Tolerance:
    type: scalar
    units: mm
    min: 0.01
    max: 0.5
    default: 0.05
    doc: Mesh from Implicit Body tolerance.
  Output Path:
    type: text
    doc: Where Export Mesh writes the head STL.
