# Phase 0 "hello band": flat band = outer cylinder minus bore cylinder.
# Built in the nTop GUI from ntop/recipes/band-primitive.md. Input names here must match the
# notebook's declared input names exactly (verify with: python -m ntopjewel templates
# ntop/notebooks/ring_band.ntop --catalog ring_band).
notebook: ring_band.ntop
version: 0.1.0
title: Flat band (two cylinders), Phase 0 hello band
output:
  name: Volume
  type: scalar
  units: mm^3
  doc: Mass Properties volume of the final band (density 1), used by the gate as a cross-check.
inputs:
  Outer Radius:
    type: scalar
    units: mm
    min: 5.0
    max: 25.0
    doc: Bore radius + band thickness. Python computes it from size and thickness.
  Bore Radius:
    type: scalar
    units: mm
    min: 5.0
    max: 15.0
    doc: Inner diameter / 2, from tables.inner_diameter_mm(size, system) + allowance.
  Width:
    type: scalar
    units: mm
    min: 1.5
    max: 15.0
    default: 4.0
    doc: Band width along the ring axis (Z in nTop).
  Mesh Tolerance:
    type: scalar
    units: mm
    min: 0.02
    max: 0.5
    default: 0.1
    doc: >-
      Mesh from Implicit Body tolerance = 2 x voxel size; triangle count scales with 1/tolerance².
      0.1 mm = 50 µm voxels (the printer's pixel) and ~0.5 M triangles for a band; 0.01 mm gave
      57 M triangles (2.7 GB STL) on 2026-10-25.
  Output Path:
    type: text
    doc: Absolute path of the STL to write (Export Mesh block; a Text variable in nTop). Python sets it.
