# Phase 3 step 1: a shaped shank. Python writes the ring unrolled as bars (X radial, Y along the
# ring, Z axial; one cross-section every few degrees at that angle's width and thickness,
# ntopjewel.shank.ShankSpec.bar_meshes - up to four files, bodies that cross each other in
# different ones); the notebook imports them, opens each by the edge round, unites them and wraps the union round Z with Remap
# Cylindrical Body (Y mapping length = Wrap Length, one turn). Built by ntop/recipes/ring_shank.py
# through the Notebook API. Verify names: python -m ntopjewel templates ntop/notebooks/ring_shank.ntop --catalog ring_shank
notebook: ring_shank.ntop
version: 0.3.1   # 0.3.1: each bar opened on its own before the union (a union's field eroded a groove along a split's seam; same inputs, rebuild the notebook; 2026-11-02); .3: four bar inputs united in nTop (Shank Path 2..4; 2026-11-02) - rebuild the notebook (api build ring_shank)
rebuild_since: 0.3.1   # the notebook body changed then (each bar opened before the union): a notebook built for an older version is refused (runs.require_built)
title: Shaped shank (tapered width and thickness) from wrapped bars
output:
  name: Volume
  type: scalar
  units: mm^3
  doc: Volume Integral of 1 over the wrapped shank, cross-checked by the gate against the design sweep.
inputs:
  Shank Path:
    type: text
    doc: Absolute path of the first bar STL (ntopjewel.shank.write_bars writes them into the run directory).
  Shank Path 2:
    type: text
    doc: The second bar (a split's upper half, a double band's bridges, a rope's or plait's second strand ...), or the speck inside the first bar when there is none.
  Shank Path 3:
    type: text
    doc: The third bar (a trinity shank's pad, a third strand), or the speck.
  Shank Path 4:
    type: text
    doc: The fourth bar (a plait's fourth strand), or the speck.
  Wrap Length:
    type: scalar
    units: mm
    min: 10.0
    max: 200.0
    doc: Remap Cylindrical's Y mapping length, one turn of the bar (the mid-wall circumference, 2π(bore + thickness/2)).
  Edge Round:
    type: scalar
    units: mm
    min: 0.0
    max: 1.0
    doc: Second Offset Body distance (+e) after the wrap; with Edge Round Inward an opening that rounds every edge a cut or a union left sharp (0 for a rope).
  Edge Round Inward:
    type: scalar
    units: mm
    min: -1.0
    max: 0.0
    doc: First Offset Body distance (-e).
  Mesh Tolerance:
    type: scalar
    units: mm
    min: 0.02
    max: 0.5
    default: 0.1
    doc: Mesh from Implicit Body tolerance = 2 x voxel size; 0.1 mm = 50 µm voxels.
  Output Path:
    type: text
    doc: Absolute path of the STL to write (Export Mesh block; a Text variable in nTop).
