# ntop/notebooks/solitaire_partial_bezel.ntop: embeds stone_seat and partial_bezel_head. Built by
# ntop/recipes/solitaire_partial_bezel.py (body: ntopjewel.nb_solitaire); run by `python -m ntopjewel solitaire
# --partial-bezel ...`; every number from ntopjewel.solitaire.SolitaireSpec.notebook_inputs.
notebook: solitaire_partial_bezel.ntop
version: 0.1.0   # 0.1.0: first build (2026-11-05)
rebuild_since: 0.1.0
title: 'Solitaire (partial_bezel_head: two walls on the flanks, a hood over each point) on a plain or tapered shank'
output:
  name: Volume
  type: scalar
  units: mm^3
  doc: Volume Integral of 1 over the ring; checked against the independent ring (solitaire.design_mesh).
inputs:
  Shank Path:
    type: text
    doc: Absolute path of the first shank bar STL (ntopjewel.shank.write_bars - the band unrolled, X radial, Y along the ring,
      Z axial; plain or shaped; bodies that cross each other in different bars), written into the run directory.
  Shank Path 2:
    type: text
    doc: The second bar (a split's upper half, a double band's bridges, a rope's or plait's second strand ...), or the smallest
      bar again when there is none.
  Shank Path 3:
    type: text
    doc: The third bar (a trinity shank's pad, a third strand), or the smallest bar again.
  Shank Path 4:
    type: text
    doc: The fourth bar (a plait's fourth strand), or the smallest bar again.
  Wrap Length:
    type: scalar
    units: mm
    min: 10.0
    max: 200.0
    doc: Remap Cylindrical's Y mapping length, one turn of the bar (the mid-wall circumference).
  Slot Path:
    type: text
    doc: Absolute path of the split's slot cutter STL (ntopjewel.shank.ShankSpec.slot_cutter, the slot swept in the ring frame
      through the arches), or a speck far outside the ring when the shank is not split.
  Cut Path:
    type: text
    doc: Absolute path of the artwork's channel cutters STL (ntopjewel.artwork.ArtworkSpec.write_layers - one body per panel,
      in the ring frame; SolitaireSpec.write_artwork), or a speck far outside the ring when the ring has no artwork.
  Relief Path:
    type: text
    doc: Absolute path of the artwork's relief STL (one body per leaf or scroll, each plugged into its channel floor), or
      a 0.2 mm speck buried in the band when the ring has no artwork - the band is carved before the arches and the head join
      it.
  Knot Path:
    type: text
    doc: Absolute path of the shoulder knots' first layer STL (ntopjewel.ornament.KnotOrnament.write_layers - each knot's
      first piece, holding one pass of every crossing; SolitaireSpec.write_knots), or a speck buried in the band when the
      ring has no knots.
  Knot Path 2:
    type: text
    doc: The knots' second layer (each knot's other piece - the pieces cross each other, so they never share a mesh), or a
      buried speck. Both united with the carved band before the arches and the head join it.
  Z Top:
    type: scalar
    units: mm
    min: 0.5
    max: 7.5
    doc: +Width/2 (the arches' extent along the axis; 0.5 for the buried stubs of a knot shank). The band is centred on the
      origin along Z.
  Z Bottom:
    type: scalar
    units: mm
    min: -7.5
    max: -0.5
    doc: -Width/2.
  Dome Tube Radius:
    type: scalar
    units: mm
    min: 0.5
    max: 500.0
    doc: "Tube radius of the dome torus = (W\xB2/4 + dome\xB2) / (2\xB7dome)."
  Edge Round:
    type: scalar
    units: mm
    min: 0.0
    max: 1.0
    doc: Second Offset Body distance (+e); rounds every edge with this radius (0 for a knot shank, whose rounds are all in
      its bar).
  Edge Round Inward:
    type: scalar
    units: mm
    min: -1.0
    max: 0.0
    doc: First Offset Body distance (-e).
  Mesh Tolerance:
    type: scalar
    units: mm
    min: 0.02
    max: 0.5
    default: 0.1
    doc: "Mesh from Implicit Body tolerance = 2 x voxel size; 0.1 mm = 50 \xB5m voxels."
  Seat Path:
    type: text
    doc: Seat envelope STL (gems.seat_envelope) for the stone_seat block inside.
  Clearance:
    type: scalar
    units: mm
    min: 0.0
    max: 0.5
    doc: Stone-to-seat gap.
  Wall:
    type: scalar
    units: mm
    min: 0.3
    max: 2.0
    doc: 'Bezel wall: the seat cutter grown by this much.'
  Bezel Bottom:
    type: scalar
    units: mm
    min: -15.0
    max: 0.0
    doc: The cup's lower edge, z (head frame).
  Cup Top:
    type: scalar
    units: mm
    min: -5.0
    max: 0.0
    doc: 'The full cup''s top, z: just under the girdle (the bearing all round).'
  Bezel Top:
    type: scalar
    units: mm
    min: 0.0
    max: 5.0
    doc: 'The walls'' top, z: the girdle top + the lip.'
  Wall Centre X:
    type: scalar
    units: mm
    min: -10.0
    max: 10.0
    doc: x of the vertical line the wall's half-spaces turn about (the outline's centroid).
  Wall From Angle:
    type: scalar
    units: deg
    min: 0.0
    max: 180.0
    doc: 'The +y wall''s start, degrees about the centre from +X (nearer the point: the larger angle).'
  Wall To Angle:
    type: scalar
    units: deg
    min: 0.0
    max: 180.0
    doc: The +y wall's end, degrees about the centre from +X.
  Hood X:
    type: scalar
    units: mm
    min: -70.0
    max: 70.0
    doc: x of the hood over the point (y = 0); far outside the stone (60) when there is none.
  Hood 2 X:
    type: scalar
    units: mm
    min: -70.0
    max: 70.0
    doc: x of a second hood (a marquise's other point); 60 when there is none.
  Hood Reach:
    type: scalar
    units: mm
    min: 0.5
    max: 5.0
    doc: 'The hood''s radius about its point: how far along the outline it holds.'
  Hood Top:
    type: scalar
    units: mm
    min: 0.0
    max: 6.0
    doc: 'The hood''s top, z: above the walls'' top by the hood rise.'
  Head Blend:
    type: scalar
    units: mm
    min: 0.0
    max: 1.0
    doc: The head block's own blend radius (prongs into rails / the bezel's edges); 0 = sharp.
  Pivot X:
    type: scalar
    units: mm
    min: 2.0
    max: 20.0
    doc: "Head placement: a 90\xB0 turn about the line through (Pivot X, 0, Pivot Z) parallel to +Y puts the girdle centre\
      \ at (girdle radius, 0, 0)."
  Pivot Z:
    type: scalar
    units: mm
    min: -20.0
    max: -2.0
    doc: = -Pivot X.
  Arch Centre X:
    type: scalar
    units: mm
    min: -40.0
    max: 40.0
    doc: 'Centre of the +y arch circle, x: -t cos(shoulder angle) (positive only for the stubs a knot shank buries under the
      head).'
  Arch Centre Y:
    type: scalar
    units: mm
    min: -40.0
    max: 0.0
    doc: 'Centre of the +y arch circle, y: -t sin(shoulder angle) (the -y arch mirrors it).'
  Arch Radius:
    type: scalar
    units: mm
    min: 0.5
    max: 80.0
    doc: "Outer radius of each arch about its centre: tangent to the band at \xB1shoulder angle, through the crest."
  Arch Dome Ring Radius:
    type: scalar
    units: mm
    min: 0.5
    max: 70.0
    doc: 'Dome torus ring radius about the arch centre (the band''s + t): the arch keeps the band''s dome.'
  Arch Cut Radius:
    type: scalar
    units: mm
    min: 5.0
    max: 20.0
    doc: 'The arch stops at this radius about the ring axis (mid-wall): it never reaches the bore.'
  Wedge Angle:
    type: scalar
    units: deg
    min: 5.0
    max: 80.0
    doc: "The arch is kept within \xB1this angle from the head (shoulder angle + 2\xB0; 10\xB0 for a knot shank's buried stubs)."
  Bead Radius:
    type: scalar
    units: mm
    min: 0.04
    max: 1.0
    doc: Milgrain bead radius (0.05 mm and buried when milgrain is off).
  Bead Z:
    type: scalar
    units: mm
    min: -5.0
    max: 5.0
    doc: 'Bead row height: band edge - 0.15 bead radii.'
  Bead Z Minus:
    type: scalar
    units: mm
    min: -5.0
    max: 5.0
    doc: = -Bead Z.
  Bead Spacing:
    type: scalar
    units: deg
    min: 0.1
    max: 360.0
    doc: Angle between beads about the arch centre (2.2 bead radii along the row).
  Bead Count:
    type: integer
    min: 1
    max: 400
    doc: 'Beads per row (four rows: two edges, two arches).'
  Bead Start X:
    type: scalar
    units: mm
    min: -40.0
    max: 40.0
    doc: +y rows start at the head end and run counter-clockwise about the +y arch centre.
  Bead Start Y:
    type: scalar
    units: mm
    min: -40.0
    max: 40.0
    doc: y of the +y rows' first bead.
  Engraving Path:
    type: text
    doc: 'The engraving STL (engrave.text_mesh, or a speck outside the ring when there is no text): wrapped round the ring,
      turned to face the palm, subtracted.'
  Engraving Wrap Length:
    type: scalar
    units: mm
    min: 10.0
    max: 200.0
    doc: "Remap Cylindrical's Y mapping length: 2\u03C0 x the radius the text is undistorted at."
  Shank Blend:
    type: scalar
    units: mm
    min: 0.0
    max: 1.0
    doc: Blend radius where the head meets the shank; the seat and engraving are cut after the blend (0 = sharp).
  Output Path:
    type: text
    doc: Where Export Mesh writes the ring.
