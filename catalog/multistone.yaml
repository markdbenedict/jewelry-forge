    min: -180.0
    max: 180.0
    doc: "Slot 4: rotation about the ring axis, the stone's angle from the top (+ towards +Y) (or the centre's again when unused)"
  Seat Path 5:
    type: text
    doc: "Slot 5: the stone's seat envelope STL (head frame; gems.seat_envelope) (or the centre's again when unused)"
  Prongs Path 5:
    type: text
    doc: "Slot 5: the head's prong rods STL (head frame; heads.OutlineHeadSpec.prongs_mesh) (or the centre's again when unused)"
  Rail Offset 5:
