  Pave Beads Path:
    type: text
    doc: "Absolute path of the pavé beads STL (ntopjewel.pave.PaveSpec.beads_mesh: disjoint spheres, ring frame), united with the shank before the heads; a speck buried in the band when there is no pavé."
  Pave Seats Path:
    type: text
    doc: "Absolute path of the pavé seats STL (every stone's cutter with its light hole, disjoint), cut after the blended join; a speck far outside the ring when there is no pavé."
  Gallery Path:
    type: text
    doc: The bridge rails along the row, one each side of the band at the heads' upper rails (ntopjewel.gallery, ring frame); a speck buried in the band without.
  Shared Prongs Path:
    type: text
    doc: The posts neighbouring stones share, one each side of the band per pair (ntopjewel.gallery); a speck buried in the band without.
  Engraving Path:
    type: text
    doc: "The engraving STL (engrave.text_mesh unwrapped, or a speck outside the ring when there is no text): wrapped round the ring, turned under the finger opposite the centre stone, cut with the seats after the blended join."
  Engraving Wrap Length:
    type: scalar
    units: mm
    min: 10.0
    max: 200.0
    doc: "Remap Cylindrical's Y mapping length: 2π x the radius the text is undistorted at (the band under the text: a taper's bottom)."
  Output Path:
    type: text
    doc: "Absolute path of the STL to write (Export Mesh block; a Text variable in nTop)."
