# A probe, not a product: does Sphere map over a list Import Points read, and which Units id is mm? Three 1 mm
# balls at points 0.1 unit apart, united; the volume says (4.73 mm³: mm, and one ball per point). Built by
# ntop/recipes/points_probe.py; the hammered texture's notebook rests on the answer (ntopjewel.texture).
notebook: points_probe.ntop
version: 0.2.1   # 0.1.0: first build (2026-11-05); 0.2.0: Points Units an input (no default; the API cannot set an enum), points 0.1 unit apart; 0.2.1: the union wrapped (measured and meshed)
rebuild_since: 0.2.1
title: Spheres at the points of a file (probe)
output:
  name: Volume
  type: scalar
  units: mm^3
  doc: Volume Integral of 1 over the united balls.
inputs:
  Points Path:
    type: text
    doc: A points file, one point per line (out/api/points_probe.csv or .txt, written by the recipe's prepare()).
  Radius:
    type: scalar
    units: mm
    min: 0.1
    max: 5.0
    default: 1.0
    doc: Every ball's radius.
  Mesh Tolerance:
    type: scalar
    units: mm
    min: 0.01
    max: 0.5
    default: 0.1
    doc: Mesh from Implicit Body tolerance (2 x voxel size).
  Points Units:
    type: enum
    choices: {mm: 1, cm: 2}    # measured 2026-11-05 (ntop/api_facts.json): 3, 4, 5 are inch or larger
    default: 1
    doc: Import Points' Units as nTop's integer id (1 = mm, 2 = cm, measured by this probe).
  Output Path:
    type: text
    doc: Where Export Mesh writes the balls' STL.
