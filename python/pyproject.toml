[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ntopjewel"
version = "0.2.0"
description = "Drive nTop (nTopCL) to build parametric jewelry, and gate every export before it is called done."
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "trimesh>=4.4",
    "pyyaml>=6.0",
    "rtree>=1.1",
    "scipy>=1.11",
    "embreex>=2.17",   # fast ray casting for the wall-thickness check (4000 rays on 1M triangles < 1 s)
    "networkx>=3.0",   # trimesh uses it to split a mesh into shells
    "matplotlib>=3.8", # glyph outlines for engraving text (TextPath + DejaVu fonts)
    "shapely>=2.0",    # text polygons -> solids
    "mapbox-earcut>=1.0",  # trimesh's triangulation engine for extrude_polygon
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
ntopjewel = "ntopjewel.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["ntopjewel*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: runs nTop through ntopcl (needs nTop installed and a licence)",
]
